# Apply in the watched cluster. Prometheus $NS in another cluster reads pods with this token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-$NS-reader
  namespace: kube-system
---
apiVersion: v1
kind: Secret
metadata:
  name: prometheus-$NS-reader
  namespace: kube-system
  annotations:
    kubernetes.io/service-account.name: prometheus-$NS-reader
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-$NS-reader
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-$NS-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-$NS-reader
subjects:
  - kind: ServiceAccount
    name: prometheus-$NS-reader
    namespace: kube-system
