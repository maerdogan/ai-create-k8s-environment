apiVersion: v1
kind: ConfigMap
metadata:
  name: dnscore-zone
  namespace: $NS
data:
  Corefile: |
    $DOMAIN:1053 {
        file /etc/coredns/zone.db {
            reload 15s
        }
        log
        errors
    }
    .:1053 {
        health :8080
        ready :8181
        prometheus :9153
        errors
    }
  zone.db: |
    $$ORIGIN $DOMAIN.
    $$TTL 60
    @ IN SOA dns.$DOMAIN. admin.$DOMAIN. $SERIAL 3600 600 86400 60
    @ IN NS dns.$DOMAIN.
    $RECORDS
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dnscore
  namespace: $NS
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dnscore
  template:
    metadata:
      labels:
        app: dnscore
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9153"
    spec:
      securityContext:
        runAsUser: 65532
        runAsNonRoot: true
      containers:
        - name: coredns
          image: ${COREDNS_IMAGE}
          args: [-conf, /etc/coredns/Corefile]
          ports:
            - containerPort: 1053
              protocol: UDP
            - containerPort: 1053
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: 8181
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 96Mi
          volumeMounts:
            - name: zone
              mountPath: /etc/coredns
      volumes:
        - name: zone
          configMap:
            name: dnscore-zone
---
apiVersion: v1
kind: Service
metadata:
  name: dnscore
  namespace: $NS
  annotations:
    metallb.io/loadBalancerIPs: $IP
spec:
  type: LoadBalancer
  selector:
    app: dnscore
  ports:
    - name: dns-udp
      port: 53
      targetPort: 1053
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 1053
      protocol: TCP
